name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt -r requirements-agent.txt httpx
      - run: python -m unittest discover -s tests -v
      - run: node --check static/evidence.js
      - run: node --check static/loop.js
      - run: node --check static/loop-onboarding.js
      - run: node --test tests/loop-ui.test.cjs tests/cli-login-ui.test.cjs
      - run: node --check static/product.js
      - run: node --check static/journeys.js
      - run: node --check static/pricing.js
      - run: node --check static/billing.js
      - run: node --check static/billing-test.js
      - run: node --check static/cli-login.js
      - run: node --check static/mcp-connect.js
      - run: node --check static/accounts.js
      - run: node --check static/app.js
      - run: node --check static/landing.js
      - run: node --experimental-strip-types --test sdk/typescript/native-analytics.test.ts
      - run: python cli/native_analytics.py --help

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t afterspan-release-check .
      - run: >-
          docker run --detach --name afterspan-release-check
          --publish 127.0.0.1:8080:8080
          --env ANALYTICS_PUBLIC_URL=http://127.0.0.1:8080
          --env ANALYTICS_PASSWORD=local-container-check-password
          --env ANALYTICS_ADMIN_TOKEN=local-container-check-admin
          --env ANALYTICS_SESSION_SECRET=local-container-check-session
          --env COOKIE_SECURE=false
          afterspan-release-check
      - run: |
          python - <<'PYTHON'
          import json,time,urllib.error,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/.well-known/afterspan',timeout=2) as response:
                      result=json.load(response)
                  assert result['product_loop']['repo_onboarding']['contract']=='afterspan-repo-goal-v2'
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not expose the new repository loop')
          PYTHON
      - if: failure()
        run: docker logs afterspan-release-check
      - if: always()
        run: docker rm --force afterspan-release-check
